name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Replace launchers with static ffmpeg
        run: |
          rm -f libs/arm64-v8a/libffmpeg.so libs/arm64-v8a/libffprobe.so
          wget -q https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-9.0/bin/ffmpeg -O libs/arm64-v8a/libffmpeg.so
          wget -q https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/main/ffmpeg-9.0/bin/ffprobe -O libs/arm64-v8a/libffprobe.so
          chmod +x libs/arm64-v8a/libffmpeg.so libs/arm64-v8a/libffprobe.so
          ls -lh libs/arm64-v8a/
          file libs/arm64-v8a/libffmpeg.so

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config m4 zlib1g-dev libncurses-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: grep -n -B2 -A15 "gradlew failed\|FAILURE:\|error:" build.log | tail -60 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cmr35-apk
          path: bin/*.apk
          retention-days: 30
