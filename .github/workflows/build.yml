name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Download static ffmpeg for android arm64
        run: |
          mkdir -p assets/bin
          wget -q https://github.com/tanersener/ffmpeg-kit/releases/download/v6.0-2/ffmpeg-kit-static-gpl-6.0-2-android-arm64-v8a.zip -O /tmp/ff.zip || \
          wget -q https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0-2/ffmpeg-kit-static-gpl-6.0-2-android-arm64-v8a.zip -O /tmp/ff.zip || \
          echo "İndirme başarısız"
          ls -lh /tmp/ff.zip || true
          unzip -o /tmp/ff.zip -d /tmp/ff || true
          find /tmp/ff -name "ffmpeg" -o -name "ffprobe" 2>/dev/null
          # Bulduysa assets'e koy
          find /tmp/ff -name "ffmpeg" -type f -exec cp {} assets/bin/ffmpeg \; 2>/dev/null || true
          find /tmp/ff -name "ffprobe" -type f -exec cp {} assets/bin/ffprobe \; 2>/dev/null || true
          chmod +x assets/bin/ffmpeg assets/bin/ffprobe 2>/dev/null || true
          ls -lh assets/bin/ || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin pkg-config m4 zlib1g-dev libncurses-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: grep -n -B2 -A15 "gradlew failed\|FAILURE:\|error:" build.log | tail -80 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cmr35-apk
          path: bin/*.apk
          retention-days: 30
